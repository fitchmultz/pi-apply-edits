name: Pi extension checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-apply-edits-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PI_AUTOMATION_REF: fe049ea97a8c91d1a4c3a0958a85b37c7759dcc6 # v1.0.0

jobs:
  official:
    name: Official Pi / macOS / Node 24
    runs-on: macos-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: extension
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: ${{ env.PI_AUTOMATION_REF }}
          path: automation
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Use the declared npm version
        run: npm install --global "$(node -p 'require("./extension/package.json").packageManager')" --no-audit --no-fund
      - name: Qualify declared official Pi
        shell: bash
        run: |
          version="$(node -p 'require("./extension/package.json").devDependencies["@earendil-works/pi-coding-agent"]')"
          GITHUB_STEP_SUMMARY='' node automation/scripts/qualify.mjs --repo pi-apply-edits \
            --source "$GITHUB_WORKSPACE/extension" --host official --target "$version" \
            --output "$RUNNER_TEMP/qualification"
          echo "Official Pi $version: package contracts and Git-consumer CLI probe passed." >> "$GITHUB_STEP_SUMMARY"

  fork:
    name: Fitch fork / Linux / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: extension
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: ${{ env.PI_AUTOMATION_REF }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/pi
          ref: main
          path: fork
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Use the declared npm version
        run: npm install --global "$(node -p 'require("./extension/package.json").packageManager')" --no-audit --no-fund
      - name: Install Linux metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install -y attr acl libcap2-bin
          command -v cc
      - name: Build the checked-out fork
        id: fork_build
        working-directory: fork
        run: |
          fork_ref="$(git rev-parse HEAD)"
          echo "sha=$fork_ref" >> "$GITHUB_OUTPUT"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run hydrate:model-data
          git diff --exit-code
          npm run build:offline
          node ../automation/scripts/pack-fork.mjs . "$RUNNER_TEMP/fork-package" "$fork_ref"
          git diff --exit-code
      - name: Qualify fork and Git consumer
        env:
          PI_COMPAT_FORK_REF: ${{ steps.fork_build.outputs.sha }}
        run: |
          GITHUB_STEP_SUMMARY='' node automation/scripts/qualify.mjs --repo pi-apply-edits \
            --source "$GITHUB_WORKSPACE/extension" --host fork \
            --target "$RUNNER_TEMP/fork-package" --output "$RUNNER_TEMP/qualification"
          echo "Fork $PI_COMPAT_FORK_REF: package contracts and Git-consumer CLI probe passed." >> "$GITHUB_STEP_SUMMARY"
