name: macOS metadata contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-metadata-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Shared compatibility owns Linux metadata tools and the official/fork matrix.
# Keep real macOS permission, filesystem and native behavior coverage here.
jobs:
  windows-paths:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/native-paths.test.ts

  check:
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0']
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install and check the locked official graph without credentials
        shell: bash
        run: |
          fixture="$(mktemp -d /tmp/pi-apply-edits.XXXXXX)"
          # setgid assertions require a fixture group belonging to the test user.
          chgrp "$(id -g)" "$fixture"
          mkdir -p "$fixture/home" "$fixture/agent" "$fixture/tmp"
          touch "$fixture/user.npmrc" "$fixture/global.npmrc"
          clean=(env -i HOME="$fixture/home" USERPROFILE="$fixture/home" PATH="$PATH"
            TMPDIR="$fixture/tmp" PI_CODING_AGENT_DIR="$fixture/agent" CI=1
            PI_OFFLINE=1 PI_TELEMETRY=0 PI_COMPAT_HOST=official
            NPM_CONFIG_USERCONFIG="$fixture/user.npmrc" NPM_CONFIG_GLOBALCONFIG="$fixture/global.npmrc"
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org/ GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1)
          "${clean[@]}" npm ci --ignore-scripts --no-audit --no-fund
          "${clean[@]}" npm run check:compat
